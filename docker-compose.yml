services:
  db:
    image: postgres:16-alpine
    container_name: wheelerdealers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wheeler
      POSTGRES_PASSWORD: wheeler_dev_pw
      POSTGRES_DB: wheelerdealers
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheeler -d wheelerdealers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
